services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-app
        ports:
            - "8001:8000"
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        depends_on:
            - db
    db:
        image: postgres:17
        environment:
            POSTGRES_DB: barbershop
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: root

        volumes:
            - db_data:/var/lib/postgresql/data
volumes:
    db_data:
